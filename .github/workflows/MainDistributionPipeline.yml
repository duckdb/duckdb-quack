#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-submodule-version:
    uses: duckdb/extension-ci-tools/.github/workflows/_submodule_version.yml@main

  duckdb-stable-build:
    name: Build extension binaries
    needs: duckdb-submodule-version
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: ${{ needs.duckdb-submodule-version.outputs.version }}
      ci_tools_version: main
      extension_name: quack
      # Export QUACK_CLIENT_ID so quack_default_client_id_env.test (require-env gated) runs instead of skipping.
      test_config: '{"test_env_variables": {"QUACK_CLIENT_ID": "quack_env_client_id"}}'

  code-quality-check:
    name: Code Quality Check
    needs: duckdb-submodule-version
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@main
    with:
      duckdb_version: ${{ needs.duckdb-submodule-version.outputs.version }}
      ci_tools_version: main
      extension_name: quack
      format_checks: 'format'

  check-protocol-version:
    name: Check protocol & QUACK_VERSION
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history to diff against origin/main

      - name: Compare schema and QUACK_VERSION against main
        run: |
          git fetch origin main
          schema_changed=$(git diff origin/main -- src/include/quack_message.json)
          version_changed=$(git diff origin/main -- src/include/quack_message.hpp | grep -c "QUACK_VERSION" || true)

          if [[ -n "$schema_changed" && "$version_changed" -eq 0 ]]; then
            echo "::error::quack_messages.json changed vs main, but QUACK_VERSION was not bumped in quack_message.hpp."
            exit 1
          fi
