#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Prepare
    runs-on: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-slim' || 'ubuntu-slim' }}
    outputs:
      runners: ${{ steps.runners.outputs.runners }}
    steps:
      - name: Detect runners
        id: runners
        uses: duckdb/duckdb-ci/detect-runners@main

  duckdb-stable-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Build extension binaries
    needs: prepare
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      ci_tools_version: main
      extension_name: quack
      runners: ${{ needs.prepare.outputs.runners }}
      # Export QUACK_CLIENT_ID so quack_default_client_id_env.test (require-env gated) runs instead of skipping.
      test_config: '{"test_env_variables": {"QUACK_CLIENT_ID": "quack_env_client_id"}}'

  duckdb-stable-deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Deploy extension binaries
    needs:
      - duckdb-stable-build
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_deploy.yml@main
    secrets: inherit
    with:
      ci_tools_version: main
      extension_name: quack
      deploy_latest: ${{ startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/main' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/main' }}

  code-quality-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@main
    with:
      ci_tools_version: main
      extension_name: quack
      format_checks: 'format'

